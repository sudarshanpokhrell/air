services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ota
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ota}
      POSTGRES_DB: ota
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ota -d ota"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    profiles: [app]
    build: .
    image: air-server
    environment:
      DATABASE_URL: postgres://ota:${POSTGRES_PASSWORD:-ota}@postgres:5432/ota?sslmode=disable
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      ASSET_BASE_URL: ${ASSET_BASE_URL}
    ports:
      - "${AIR_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
